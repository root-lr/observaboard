# ObservaBoard alert rule unit tests.
# Run: make test-rules   (generates the rules, then runs promtool test rules)
rule_files:
  - ../../build/central/prometheus/rules/observa.yml

evaluation_interval: 30s

tests:
  # ---------------------------------------------------------------------------
  # 5xx errors: default threshold (5%), routed to the project's channels.
  - name: 5xx errors above the default threshold
    interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="api", span_kind="SPAN_KIND_SERVER", http_response_status_code="200"}'
        values: '0+30x60'      # 1 request/s
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="api", span_kind="SPAN_KIND_SERVER", http_response_status_code="500"}'
        values: '0+3x60'       # 0.1 error/s, i.e. 9% of responses
      - series: 'container_last_seen{project="shop", env="prod", service="api", host="srv-a"}'
        values: '0+30x60'
      - series: 'observa_service_info{project="shop", env="prod", service="api", preset="django", notify_critical="ops", notify_warning="team", host="srv-a"}'
        values: '1x60'
    promql_expr_test:
      - expr: observa:threshold:http_error_ratio
        eval_time: 20m
        exp_samples:
          - labels: 'observa:threshold:http_error_ratio{project="shop", env="prod", service="api"}'
            value: 0.05
    alert_rule_test:
      - eval_time: 20m
        alertname: ObservaHighErrorRate
        exp_alerts:
          - exp_labels:
              severity: critical
              project: shop
              env: prod
              service: api
              notify_critical: ops
              notify_warning: team
            exp_annotations:
              summary: "shop/prod/api: 9.091% 5xx responses"
              description: "The share of 5xx responses has been above the threshold for 5 minutes."
              runbook_url: "https://example.com/runbooks/observa-high-error-rate"
              dashboard_url: "https://example.com/d/observa-http?var-project=shop&var-env=prod&var-service=api"
      - eval_time: 20m
        alertname: ObservaServiceDown
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # Same traffic with the threshold raised to 20% in observa.yaml: no alert.
  - name: threshold overridden by observa.yaml
    interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="api", span_kind="SPAN_KIND_SERVER", http_response_status_code="200"}'
        values: '0+30x60'
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="api", span_kind="SPAN_KIND_SERVER", http_response_status_code="500"}'
        values: '0+3x60'
      - series: 'container_last_seen{project="shop", env="prod", service="api", host="srv-a"}'
        values: '0+30x60'
      - series: 'observa_service_threshold{project="shop", env="prod", service="api", threshold="http_error_ratio", host="srv-a"}'
        values: '0.2x60'
    promql_expr_test:
      - expr: observa:threshold:http_error_ratio
        eval_time: 20m
        exp_samples:
          - labels: 'observa:threshold:http_error_ratio{project="shop", env="prod", service="api"}'
            value: 0.2
    alert_rule_test:
      - eval_time: 20m
        alertname: ObservaHighErrorRate
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # Traffic too low (fewer than 3 requests/minute): no alert even at 50% errors.
  - name: no alert on near-zero traffic
    interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="api", span_kind="SPAN_KIND_SERVER", http_response_status_code="200"}'
        values: '0+0.5x60'
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="api", span_kind="SPAN_KIND_SERVER", http_response_status_code="500"}'
        values: '0+0.5x60'
      - series: 'container_last_seen{project="shop", env="prod", service="api", host="srv-a"}'
        values: '0+30x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ObservaHighErrorRate
        exp_alerts: []

  # ---------------------------------------------------------------------------
  # Service down: the container has not been seen for 10 minutes.
  - name: service down
    interval: 30s
    input_series:
      - series: 'container_last_seen{project="shop", env="prod", service="worker", host="srv-a"}'
        values: '0+30x20 _x40'
    alert_rule_test:
      - eval_time: 9m
        alertname: ObservaServiceDown
        exp_alerts: []
      - eval_time: 20m
        alertname: ObservaServiceDown
        exp_alerts:
          - exp_labels:
              severity: critical
              project: shop
              env: prod
              service: worker
              host: srv-a
            exp_annotations:
              summary: "shop/prod/worker is no longer running on srv-a"
              description: "The container has not been seen for 10m 0s."
              runbook_url: "https://example.com/runbooks/observa-service-down"
              dashboard_url: "https://example.com/d/observa-container?var-project=shop&var-env=prod&var-service=worker"

  # ---------------------------------------------------------------------------
  # Silent agent: no host metrics for 10 minutes.
  - name: silent agent
    interval: 30s
    input_series:
      - series: 'node_boot_time_seconds{job="observa/host", host="srv-b"}'
        values: '1000x20 _x40'
      - series: 'node_boot_time_seconds{job="observa/host", host="srv-a"}'
        values: '1000x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ObservaAgentSilent
        exp_alerts:
          - exp_labels:
              severity: critical
              host: srv-b
            exp_annotations:
              summary: "Agent srv-b is no longer sending data"
              description: "No data received for more than 5 minutes: server down, agent stopped or network cut."
              runbook_url: "https://example.com/runbooks/observa-agent-silent"
              dashboard_url: "https://example.com/d/observa-host?var-host=srv-b"

  # ---------------------------------------------------------------------------
  # PostgreSQL: 90 connections out of 100 exceed the default threshold (80%).
  - name: PostgreSQL connections
    interval: 30s
    input_series:
      - series: 'pg_up{project="shop", env="prod", service="db"}'
        values: '1x60'
      - series: 'pg_stat_activity_count{project="shop", env="prod", service="db", datname="shop", state="active"}'
        values: '30x60'
      - series: 'pg_stat_activity_count{project="shop", env="prod", service="db", datname="shop", state="idle"}'
        values: '60x60'
      - series: 'pg_settings_max_connections{project="shop", env="prod", service="db"}'
        values: '100x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ObservaPostgresConnectionsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              project: shop
              env: prod
              service: db
            exp_annotations:
              summary: "shop/prod/db: 90% of PostgreSQL connections in use"
              description: "The number of connections is approaching max_connections."
              runbook_url: "https://example.com/runbooks/observa-postgres-connections-high"
              dashboard_url: "https://example.com/d/observa-postgres?var-project=shop&var-env=prod&var-service=db"

  # ---------------------------------------------------------------------------
  # Celery queue: 150 messages trigger the alert with the default threshold (100),
  # but not with the threshold raised to 500.
  - name: Celery queue
    interval: 30s
    input_series:
      - series: 'redis_up{project="shop", env="prod", service="cache"}'
        values: '1x60'
      - series: 'redis_key_size{project="shop", env="prod", service="cache", db="db0", key="celery"}'
        values: '150x60'
      - series: 'redis_up{project="blog", env="prod", service="cache"}'
        values: '1x60'
      - series: 'redis_key_size{project="blog", env="prod", service="cache", db="db0", key="celery"}'
        values: '150x60'
      - series: 'observa_service_threshold{project="blog", env="prod", service="cache", threshold="queue_length"}'
        values: '500x60'
    alert_rule_test:
      - eval_time: 20m
        alertname: ObservaQueueBacklog
        exp_alerts:
          - exp_labels:
              severity: warning
              project: shop
              env: prod
              service: cache
            exp_annotations:
              summary: "shop/prod: 150 tasks waiting in the Celery queue"
              description: "The `celery` queue on cache has been growing for 10 minutes: the workers cannot keep up."
              runbook_url: "https://example.com/runbooks/observa-queue-backlog"
              dashboard_url: "https://example.com/d/observa-celery?var-project=shop&var-env=prod"

  # ---------------------------------------------------------------------------
  # Celery tasks: 50% failures (computed from the workers' span metrics).
  - name: Celery task failures
    interval: 30s
    input_series:
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="worker", span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_OK"}'
        values: '0+3x60'
      - series: 'traces_spanmetrics_calls_total{project="shop", env="prod", service="worker", span_kind="SPAN_KIND_CONSUMER", status_code="STATUS_CODE_ERROR"}'
        values: '0+3x60'
      - series: 'container_last_seen{project="shop", env="prod", service="worker", host="srv-a"}'
        values: '0+30x60'
    alert_rule_test:
      - eval_time: 25m
        alertname: ObservaCeleryTaskFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              project: shop
              env: prod
              service: worker
            exp_annotations:
              summary: "shop/prod/worker: 50% failed tasks"
              description: "The share of failed Celery tasks has been above the threshold for 10 minutes."
              runbook_url: "https://example.com/runbooks/observa-celery-task-failures"
              dashboard_url: "https://example.com/d/observa-celery?var-project=shop&var-env=prod&var-service=worker"

  # ---------------------------------------------------------------------------
  # Two agents publish different channels for the same service (rollout
  # of a modified observa.yaml in progress): the alert still fires, only once.
  - name: conflicting routing between two agents
    interval: 30s
    input_series:
      - series: 'container_last_seen{project="shop", env="prod", service="api", host="srv-a"}'
        values: '0+30x20 _x40'
      - series: 'observa_service_info{project="shop", env="prod", service="api", preset="django", notify_critical="ops", host="srv-a"}'
        values: '1x60'
      - series: 'observa_service_info{project="shop", env="prod", service="api", preset="django", notify_critical="team", host="srv-b"}'
        values: '1x60'
    promql_expr_test:
      - expr: count(observa:service:routing{project="shop", service="api"})
        eval_time: 20m
        exp_samples:
          - labels: '{}'
            value: 1
